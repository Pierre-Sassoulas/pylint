# Most of this is inspired by the mypy primer
# See: https://github.com/hauntsaninja/mypy_primer
# This is the primer job that creates the comment on the PR
# It needs to trigger on workflow_run instead of pull_request
# as we need repository wide access to create a comment

name: Primer / Comment

on:
  workflow_run:
    workflows: [Primer / Run, Primer / Extended]
    types:
      - completed

env:
  # This needs to be the SAME as in the Main and PR job
  CACHE_VERSION: 4
  KEY_PREFIX: venv-primer
  # If you change this, also change PRIMER_CURRENT_INTERPRETER in
  # tests/testutils/_primer/test_primer.py
  DEFAULT_PYTHON: "3.15"

permissions:
  contents: read
  pull-requests: write

jobs:
  primer-comment:
    # Skip job if the workflow failed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Run
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          allow-prereleases: true
          check-latest: true

      # Restore cached Python environment
      - name: Restore Python virtual environment
        id: cache-venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: venv
          key:
            ${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{
            env.KEY_PREFIX }}-${{ env.CACHE_VERSION }}-${{ hashFiles('pyproject.toml',
            'requirements_test.txt', 'requirements_test_min.txt',
            'requirements_test_pre_commit.txt') }}
      # The cache can be evicted between the moment it is created on 'main'
      # and the moment this job runs, so recreate the virtual environment
      # if it is missing.
      - name: Create Python virtual environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv venv
          . venv/bin/activate
          python -m pip install --upgrade pip
          pip install --upgrade --requirement requirements_test.txt
      # The cached venv contains the pylint that was installed when the cache was
      # created, which can be stale. Reinstall from the current checkout so the
      # comparison and comment rendering use the right code (see #11153).
      - name: Install pylint from the current checkout
        run: |
          . venv/bin/activate
          pip install . --no-deps

      - name: Download outputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Download workflow pylint output
            const fs = require('fs');
            const artifacts_workflow = await github.rest.actions.listWorkflowRunArtifacts({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: ${{ github.event.workflow_run.id }},
            });

            // Get 'main' and 'PR' outputs and PR number
            const artifacts = artifacts_workflow.data.artifacts.filter((artifact) =>
              artifact.name.startsWith(`primer_output_main_${process.env.DEFAULT_PYTHON}`)
              || artifact.name.startsWith(`primer_output_pr_${process.env.DEFAULT_PYTHON}`)
              || artifact.name === 'pr_number'
            );
            for (const artifact of artifacts) {
              const downloaded = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
                archive_format: "zip",
              });
              fs.writeFileSync(`${artifact.name}.zip`, Buffer.from(downloaded.data));
            }

      - name: Unzip outputs
        id: unzip
        run: |
          for artifact in *.zip; do
            unzip "$artifact"
          done
          # 'Primer / Extended' launched without a pull request number has no
          # pull request to comment on
          if [[ -f pr_number.txt ]]; then
            echo "has-pr=true" >> "$GITHUB_OUTPUT"
          fi
      # 'Primer / Run' and 'Primer / Extended' do not use the same number of
      # batches: count the outputs of the PR run.
      - name: Compare outputs
        id: compare
        if: steps.unzip.outputs.has-pr == 'true'
        run: |
          . venv/bin/activate
          # 'Primer / Extended' runs on the merge commit of the PR, and saves
          # the head of the PR
          commit=${GITHUB_EVENT_WORKFLOW_RUN_HEAD_SHA}
          if [[ -f pr_head.txt ]]; then
            commit=$(cat pr_head.txt)
          fi
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unexpected commit '$commit'"
            exit 1
          fi
          batches=$(ls output_${{ env.DEFAULT_PYTHON }}_pr_batch*.txt | wc -l)
          extended=()
          primer_directory=tests/.pylint_primer_tests
          if [[ "${WORKFLOW_NAME}" == "Primer / Extended" ]]; then
            extended=(--extended)
            primer_directory=$primer_directory/extended_primer
          fi
          python tests/primer/__main__.py "${extended[@]}" compare \
          --commit="$commit" \
          --pr="$(cat pr_number.txt)" \
          --base-file=output_${{ env.DEFAULT_PYTHON }}_main_BATCHIDX.txt \
          --new-file=output_${{ env.DEFAULT_PYTHON }}_pr_BATCHIDX.txt \
          --batches="$batches"
          echo "comment-file=$primer_directory/comment.txt" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_EVENT_WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      - name: Post comment
        id: post-comment
        if: steps.unzip.outputs.has-pr == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMENT_FILE: ${{ steps.compare.outputs.comment-file }}
        with:
          script: |
            const fs = require('fs')
            const comment = fs.readFileSync(process.env.COMMENT_FILE, { encoding: 'utf8' })
            console.log("Comment to post:")
            console.log(comment)
            const prNumber = parseInt(fs.readFileSync("pr_number.txt", { encoding: "utf8" }))
            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            })
            return prNumber
      - name: Hide old comments
        if: steps.unzip.outputs.has-pr == 'true'
        # Taken from mypy primer
        uses: kanga333/comment-hider@c12bb20b48aeb8fc098e35967de8d4f8018fffdf # v0.4.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          leave_visible: 1
          issue_number: ${{ steps.post-comment.outputs.result }}
